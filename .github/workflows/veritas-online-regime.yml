name: VERITAS online regime policy

on:
  push:
    branches:
      - research/full-arsenal-20261005
    paths:
      - tools/research_crypto_online_regime_policy.py
      - .github/workflows/veritas-online-regime.yml
  workflow_dispatch:

jobs:
  online-regime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-arsenal-20261005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Download 2022-2026 spot cache
        uses: actions/download-artifact@v4
        with:
          name: veritas-manager-library-result
          path: manager_library_out
          github-token: ${{ github.token }}
          run-id: 37210798801
      - name: Download 2020-2021 spot cache
        uses: actions/download-artifact@v4
        with:
          name: veritas-external-holdout
          path: external_holdout_out
          github-token: ${{ github.token }}
          run-id: 37268494688
      - name: Run fully causal online regime policy
        run: python tools/research_crypto_online_regime_policy.py
      - name: Print compact
        if: always()
        run: |
          if [ -f online_regime_out/result.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('online_regime_out/result.json'))
          out={a:{p:{k:v.get(k) for k in ('base','stress5','years','stress_years')} for p,v in z.get('policies',{}).items()} for a,z in x.get('assets',{}).items()}
          print('VERITAS_ONLINE_REGIME_COMPACT='+json.dumps(out,separators=(',',':')))
          PY
          fi
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-online-regime
          path: online_regime_out/
          retention-days: 14
