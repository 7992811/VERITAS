name: VERITAS specialist external control

on:
  push:
    branches:
      - research/full-arsenal-20261005
    paths:
      - tools/research_crypto_specialist_external.py
      - tools/research_crypto_multihorizon_trend.py
      - tools/research_eth_long_neighborhood.py
      - tools/research_eth_short_neighborhood.py
      - .github/workflows/veritas-specialist-external.yml
  workflow_dispatch:

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-arsenal-20261005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Download external 2020-2021 cache
        uses: actions/download-artifact@v4
        with:
          name: veritas-external-holdout
          path: external_holdout_out
          github-token: ${{ github.token }}
          run-id: 37268494688
      - name: Run frozen specialist control
        run: python tools/research_crypto_specialist_external.py
      - name: Print compact
        if: always()
        run: |
          if [ -f specialist_external_out/result.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('specialist_external_out/result.json'))
          print('VERITAS_SPECIALIST_EXTERNAL_COMPACT='+json.dumps(x.get('modules',{}),separators=(',',':')))
          PY
          fi
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-specialist-external
          path: specialist_external_out/
          retention-days: 14
