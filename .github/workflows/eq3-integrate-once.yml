name: EQ3 Integration Verification
on:
  push:
    branches: [feature/execution-quality-v3-integrated-20261006]
    paths: ['.github/workflows/eq3-integrate-once.yml']
permissions:
  contents: write
concurrency:
  group: eq3-integration-feature-only
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feature/execution-quality-v3-integrated-20261006'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_test_only
          POSTGRES_DB: veritas_quality_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veritas_quality_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Apply reviewed source changes and verify exact tested digests
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feature/execution-quality-v3-integrated-20261006'
          git merge-base --is-ancestor d7a22498e23d0f323c5f7410b9fb1edc1da67b99 HEAD
          git apply --check tools/eq3_integration_1.patch tools/eq3_integration_2.patch
          git apply tools/eq3_integration_1.patch tools/eq3_integration_2.patch
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          expected=json.loads(pathlib.Path('tools/eq3_manifest.json').read_text())
          failed=[]
          for name,digest in expected.items():
              actual=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
              if actual!=digest:failed.append((name,actual,digest))
          if failed:
              print('SOURCE DIGEST MISMATCH',failed)
              raise SystemExit(1)
          changed=subprocess.check_output(['git','diff','--name-only']).decode().splitlines()
          if any(name not in expected for name in changed):
              raise SystemExit('Unexpected modified path')
          pathlib.Path('/tmp/eq3-stage-paths').write_bytes(b'\0'.join(n.encode() for n in changed)+b'\0')
          print('Verified exact source digests:',len(expected))
          PY
      - name: Install dependencies
        run: pip install -r requirements-intelligence.txt
      - name: Execution, roles, owner rules, source and accounting regressions
        run: |
          python -m unittest -v test_veritas_execution_quality test_veritas_architecture_v2 test_veritas_canonical_constitution test_veritas_currency_portfolio test_veritas_r82_cost_policy test_veritas_cost_audit_repairs test_veritas_v90_market_cases test_veritas_single_source test_veritas_profit_protection test_veritas_trade_view test_veritas_gold_profinance test_veritas_thesis_guard test_veritas_tbank test_veritas_timeframe_structure test_veritas_timeframe_policy test_veritas_timeframe_data test_veritas_timeframe_management test_veritas_profinance_history test_veritas_user_teaching test_veritas_repeat_add test_veritas_v90_safety test_veritas_learning_index test_veritas_management_intelligence
          node tools/test_paper_ui.cjs
          python tools/architecture_guard.py
      - name: Verify idempotent reviews in isolated PostgreSQL
        env:
          VERITAS_QUALITY_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test
        run: python -m unittest -v test_veritas_strategy_quality_sql
      - name: Commit verified source only to this feature branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'feature/execution-quality-v3-integrated-20261006'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --pathspec-from-file=/tmp/eq3-stage-paths --pathspec-file-nul
          git diff --cached --check
          git commit -m 'Integrate verified paper execution-quality v3 without changing owner timeframe safeguards'
          git push origin HEAD:refs/heads/feature/execution-quality-v3-integrated-20261006
