name: Owner swing repair verification
on:
  push:
    branches: [fix/owner-breakout-last-confirmed-swing-20261007]
    paths: [.github/workflows/owner-swing-repair-once.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/owner-breakout-last-confirmed-swing-20261007
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Apply exactly the reviewed swing-selection correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('veritas_structural_breakout.py')
          raw = p.read_bytes()
          digest = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          if digest != 'abe6bb05396eb02928464462af0796dd1c114344':
              raise SystemExit('Base source changed; refusing to patch')
          old = '''    anchor = candidates[0]
              # A pivot must protect this structural leg, not be an unrelated extremum
              # from after the trigger's own pivot when initiating a new thesis.
              preceding = [p for p in candidates if p["pivot_at"] <= trigger["pivot_at"]]
              if preceding:
                  anchor = preceding[0]
          '''
          new = '''    # A confirmed pullback may form AFTER the high/low being broken.
              # For a new leg use the latest opposite swing available at the quote,
              # not an older swing preceding the trigger's own pivot. Existing
              # protected legs retain the no-widening path above.
              anchor = candidates[0]
          '''
          text = raw.decode('utf-8')
          if text.count(old) != 1:
              raise SystemExit('Expected anchor block not found exactly once')
          p.write_text(text.replace(old, new), encoding='utf-8')
          t = Path('test_veritas_structural_breakout.py')
          source = t.read_text(encoding='utf-8')
          marker = '\n\nclass '
          if marker not in source:
              raise SystemExit('Test suite anchor not found')
          source = source.replace(marker, '\n\nfrom test_veritas_last_confirmed_swing import LastConfirmedSwingTests\n' + marker, 1)
          t.write_text(source, encoding='utf-8')
          PY
          python -m py_compile veritas_structural_breakout.py test_veritas_structural_breakout.py test_veritas_last_confirmed_swing.py
          git diff --check
          git diff --stat
      - name: Save the exact source correction on the repair branch, never main
        run: |
          git config user.name 'VERITAS repair verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veritas_structural_breakout.py test_veritas_structural_breakout.py
          git commit -m 'Use latest confirmed opposite swing for new structural leg; preserve held stop'
          git push origin HEAD:fix/owner-breakout-last-confirmed-swing-20261007
      - name: Install existing runtime dependencies
        run: pip install -r requirements-intelligence.txt
      - name: Verify owner rules, actual CNY prefixes, risk, source and lifecycle
        run: |
          python -m unittest -v test_veritas_structural_breakout.py test_veritas_structural_cny_episodes.py test_veritas_structural_facts_cache.py test_veritas_breakout_runtime.py test_veritas_weighted_structural_economics.py test_veritas_structural_lifecycle.py test_veritas_structural_management.py test_veritas_source_identity_roundtrip.py test_veritas_user_teaching.py test_veritas_repeat_add.py
