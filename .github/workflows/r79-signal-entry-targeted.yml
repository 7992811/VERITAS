name: R79 signal entry targeted test

on:
  push:
    branches:
      - test/r79-signal-entry-20261005
  workflow_dispatch:

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/r79-signal-entry-20261005
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - name: Install runtime dependencies
        run: pip install -r requirements-intelligence.txt
      - name: Compile changed runtime
        run: python -m py_compile veritas_trend_entry.py veritas_execution.py veritas_portfolio_runtime.py
      - name: Run R79 targeted tests
        run: python -m unittest -v test_r79_signal_authoritative.py
