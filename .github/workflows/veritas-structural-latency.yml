name: VERITAS Structural Latency Invariants
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - run: pip install -r requirements-intelligence.txt
      - name: Copy isolation, exact proof cache, causal history and reserved entry retries
        run: python -m unittest -v test_veritas_data_copy.py test_veritas_structural_latency.py test_veritas_retry_freshness.py test_veritas_structural_breakout.py test_veritas_structural_facts_cache.py test_veritas_structural_cny_episodes.py test_veritas_breakout_runtime.py test_veritas_currency_feed_recovery.py test_veritas_weighted_structural_economics.py test_veritas_structural_lifecycle.py test_veritas_structural_management.py test_veritas_book_lock.py test_veritas_portfolio_cycle.py test_veritas_source_identity_roundtrip.py test_veritas_repeat_add.py
      - name: Existing architecture ceilings
        run: python tools/architecture_guard.py
