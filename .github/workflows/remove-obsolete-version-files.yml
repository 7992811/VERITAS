name: Remove obsolete VERITAS version files

on:
  push:
    paths:
      - '.github/workflows/remove-obsolete-version-files.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove obsolete version files
        run: |
          python - <<'PY'
          from pathlib import Path

          obsolete = [
              'apply_v70_patch.py',
              'test_veritas_v701.py',
              'test_veritas_v702.py',
              'test_veritas_v703.py',
              'test_veritas_v72.py',
          ]
          for name in obsolete:
              p = Path(name)
              if p.exists():
                  p.unlink()

          wf = Path('.github/workflows/remove-obsolete-version-files.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Verify canonical runtime still imports
        run: |
          pip install -r requirements-intelligence.txt
          python -m py_compile veritas_intelligence.py veritas_portfolio.py veritas_v90_ui.py veritas_signal_core.py
          python - <<'PY'
          import veritas_intelligence as vi
          import veritas_portfolio as vp
          import veritas_signal_core as sc
          assert vi.VERSION == 'veritas-max-product-v90.0-four-portfolio-core'
          assert vp.VERSION == 'veritas-portfolio-v9.0-four-portfolio-core'
          assert sc.VERSION == 'veritas-signal-core-v9.0'
          print('OBSOLETE_VERSION_FILES_REMOVED')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "VERITAS Canonicalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VERITAS v9.0: remove obsolete version files"
          git push origin HEAD:main
