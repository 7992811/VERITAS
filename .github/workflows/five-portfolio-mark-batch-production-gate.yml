name: Five Portfolio Mark Batch Production Gate
on:
  push:
    branches: [ "ci/five-portfolio-mark-batch-gate-da960d1" ]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_test_only
          POSTGRES_DB: veritas_quality_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veritas_quality_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - run: pip install -r requirements-intelligence.txt
      - name: Compile marking runtime
        run: python -m py_compile veritas_book_marking.py veritas_portfolio.py
      - name: Marking unit parity excluding known baseline-stale assertions
        run: |
          python -m unittest -v             test_veritas_book_marking.BookMarkingTests.test_brent_present_null_pin_is_not_repaired_into_legacy_absence             test_veritas_book_marking.BookMarkingTests.test_full_and_projected_nav_agree_for_sources_fallbacks_and_corrupt_shapes             test_veritas_book_marking.BookMarkingTests.test_mark_delta_matches_full_baseline_and_does_not_send_retained_history             test_veritas_book_marking.BookMarkingTests.test_marker_preserves_nonobject_behavior_and_skips_unusable_quotes
      - name: Native PostgreSQL marking parity and rollback
        env:
          VERITAS_QUALITY_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test
        run: python -m unittest -v test_veritas_book_marking_sql.py
      - name: Independent five-book contracts
        run: python -m unittest -v test_veritas_portfolio_cycle.py test_veritas_accounting_io.py
