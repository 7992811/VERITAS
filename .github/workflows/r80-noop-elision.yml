name: R80 Noop Elision CI
on:
  push:
    branches: [ "ci/r80-noop-elision-7a1e808" ]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_test_only
          POSTGRES_DB: veritas_quality_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veritas_quality_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - run: pip install -r requirements-intelligence.txt
      - name: Compile R80 runtime
        run: python -m py_compile veritas_portfolio_runtime.py veritas_thesis_guard.py veritas_timeframe_management.py
      - name: R80 no-op and evidence lifetime contracts
        run: python -m unittest -v test_veritas_r80_noop_elision.py test_veritas_r80_snapshot_lifetimes.py
      - name: Thesis and timeframe management contracts
        run: python -m unittest -v test_veritas_position_thesis.py test_veritas_thesis_guard.py test_veritas_timeframe_management.py test_veritas_profit_protection.py
      - name: Native PostgreSQL timeframe management
        env:
          VERITAS_QUALITY_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test
        run: python -m unittest -v test_veritas_timeframe_management_sql.py test_veritas_profit_protection_projection_sql.py
      - name: Independent portfolio book contracts
        run: python -m unittest -v test_veritas_portfolio_cycle.py
