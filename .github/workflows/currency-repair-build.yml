name: Currency recovery candidate verification
on:
  push:
    branches: [diagnostic/currency-repair-source-20261007]
    paths: [.github/workflows/currency-repair-build.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b574a46f4e15771226e49cb959e972b9d38b1311
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Apply exact locally tested candidate
        run: |
          mkdir -p /tmp/currency-candidate
          python - <<'PY'
          import base64, zlib, hashlib, pathlib, subprocess
          data=''
          data=data.replace('TJA0+UZHwSA','TJA0+ZHwSA')
          patch=zlib.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest()=='b7108c91a5595c32418807720ed5c3732df33341b9c80202a9d0eda79df55ecf'
          path=pathlib.Path('/tmp/currency-candidate/reviewed.patch');path.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(path)],check=True)
          subprocess.run(['git','apply',str(path)],check=True)
          PY
      - name: Install dependencies
        run: pip install -r requirements-intelligence.txt
      - name: Full-fixture targeted regression checks
        run: |
          set -o pipefail
          python -m unittest -v test_veritas_currency_feed_recovery test_veritas_tbank test_veritas_breakout_runtime test_veritas_book_lock test_veritas_structural_lifecycle test_veritas_direct_cny_snapshot test_veritas_portfolio_cycle 2>&1 | tee /tmp/currency-candidate/selected-tests.log
          git diff --check
      - name: Publish candidate branch only
        run: |
          git config user.name 'VERITAS repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c fix/currency-feed-recovery-20261007
          git restore .github/workflows/veritas-safety.yml
          git add test_veritas_currency_feed_recovery.py veritas_book_lock.py veritas_breakout_runtime.py veritas_release.py veritas_structural_lifecycle.py veritas_tbank.py
          git commit -m 'Recover direct CNY feed and hand off busy paper entry retries (v91.7.16)'
          git push origin HEAD:refs/heads/fix/currency-feed-recovery-20261007
          git rev-parse HEAD | tee /tmp/currency-candidate/commit.txt
      - name: Export code and public test fixtures for independent verification
        if: always()
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile
          with zipfile.ZipFile('/tmp/currency-candidate/source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in subprocess.check_output(['git','ls-files','-z']).decode().split('\0'):
                  p=pathlib.Path(name)
                  if p.is_file() and (p.suffix in {'.py','.js','.cjs','.yml','.yaml','.pem'} or name.startswith('tests/fixtures/') or p.name.startswith('requirements')):
                      z.write(p,name)
              p=pathlib.Path('test_veritas_currency_feed_recovery.py')
              if p.is_file() and str(p) not in z.namelist():z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: currency-recovery-candidate
          path: /tmp/currency-candidate
          retention-days: 1
