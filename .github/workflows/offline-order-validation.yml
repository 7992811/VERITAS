name: Offline order lifecycle
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Install existing test dependencies
        run: pip install -r requirements-intelligence.txt
      - name: Require all offline scenarios without network or skips
        run: |
          python - <<'PY'
          import json,socket,unittest
          def deny(*args,**kwargs):
              raise AssertionError('Network is forbidden in offline order validation')
          socket.create_connection=deny
          socket.socket.connect=deny
          socket.socket.connect_ex=deny
          loader=unittest.defaultTestLoader
          suite=unittest.TestSuite([
              loader.loadTestsFromName('test_veritas_offline_order_cycle'),
              loader.loadTestsFromName('test_veritas_signal_robot'),
              loader.loadTestsFromName('test_veritas_trade_approvals'),
              loader.loadTestsFromName('test_veritas_currency_trade_service'),
              loader.loadTestsFromName('test_veritas_currency_trading'),
          ])
          count=suite.countTestCases()
          if count<80:
              raise RuntimeError('Offline trading/robot coverage unexpectedly reduced')
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          print(json.dumps({'mode':'OFFLINE_FIXTURES','tests':result.testsRun,
              'failures':len(result.failures),'errors':len(result.errors),
              'skipped':len(result.skipped),'broker_sandbox_validated':False,
              'live_trading_authorized':False}))
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          PY
