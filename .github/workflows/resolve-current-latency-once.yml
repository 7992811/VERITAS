name: Materialize verified latency integration
on:
  push:
    branches: [fix/structural-latency-book-20261007]
    paths: [.github/workflows/resolve-current-latency-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed merge resolution to three source files only
        run: |
          git fetch --depth=1 origin 5bf732c4404c777e6f9c0e3cf5d6376b037ef5bc
          git checkout 5bf732c4404c777e6f9c0e3cf5d6376b037ef5bc -- veritas_breakout_runtime.py veritas_structural_breakout.py veritas_timeframe_data.py
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          encoded=''
          # The exact resolution is expressed below instead of accepting an opaque payload.
          p=Path('veritas_structural_breakout.py');s=p.read_text()
          s=s.replace('from copy import deepcopy\n','from veritas_data_copy import deepcopy\n',1)
          a='from veritas_quote_time import quote_gate\n';assert s.count(a)==1
          s=s.replace(a,a+'import veritas_structural_validation_cache as SVC\n')
          a='def validate_event(event, source_identity=None):\n';assert s.count(a)==1
          s=s.replace(a,'def validate_event(event, source_identity=None):\n    # Static evidence only. Current quote/time, spent barriers, entry expiry and\n    # full portfolio risk remain independently checked on every decision.\n    return SVC.verify(event, source_identity, version=VERSION,\n                      defaults=DEFAULT_POLICY, validator=_validate_event_uncached)\n\n\ndef _validate_event_uncached(event, source_identity=None):\n')
          a='                      active_event=deepcopy(event), protected_leg=deepcopy(leg))\n';assert s.count(a)==1
          s=s.replace(a,'                      active_event=event, protected_leg=leg)\n');p.write_text(s)
          p=Path('veritas_timeframe_data.py');s=p.read_text().replace('from copy import deepcopy\n','from veritas_data_copy import deepcopy\n',1)
          a='        witness = deepcopy(active)\n';assert s.count(a)==1
          s=s.replace(a,'        # _spend writes only its top-level spent fields; historical proof\n        # fields are read-only. A full graph clone here is discarded at return.\n        witness = dict(active)\n');p.write_text(s)
          # Combine the already-reviewed retry block with current-main publication.
          old=subprocess.check_output(['git','show','869b2895fa18f3ff16a6e71a875fc6a79e3e656e:veritas_breakout_runtime.py']).decode()
          p=Path('veritas_breakout_runtime.py');s=p.read_text().replace('from copy import deepcopy\n','from veritas_data_copy import deepcopy\n',1)
          def block(text,start,end):return text[text.index(start):text.index(end,text.index(start))]
          def swap(start,end):
              global s
              s=s.replace(block(s,start,end),block(old,start,end),1)
          s=s.replace('INTERVAL_SECONDS = 5.0\n','INTERVAL_SECONDS = 5.0\nBOOK_RETRY_SECONDS = 0.5\n',1)
          s=s.replace('        self._pending, self._observations = {}, {}\n','        self._pending, self._observations = {}, {}\n        self._pending_entry_rows = []\n',1)
          a='        self.state = {"status": "READY", "version": VERSION, "paper_only": True,\n';assert s.count(a)==1
          s=s.replace(a,a+'                      "latency_policy_version": "NATIVE_COPY_AND_RESERVED_RETRY_V2",\n')
          swap('    def _fresh_quote(', '    def _row(')
          a='        row["timeframe_entry_context"] = public_context\n';assert s.count(a)==1
          s=s.replace(a,'        public_context.setdefault("levels", [])\n'+a)
          retry=block(old,'    def _retry_entry(', '    def run_once(')
          s=s.replace('    def run_once(',retry+'    def run_once(',1)
          a='            context_started = time.monotonic()\n';assert s.count(a)==1
          s=s.replace(a,'            if self._pending_entry_rows:\n                return self._retry_entry(markets, observed_quotes, clock, started)\n'+a)
          start='                if execution.get("status") == "BUSY":\n';end='                publish_started = time.monotonic()\n'
          s=s.replace(block(s,start,end),block(old,'                if execution.get("status") == "BUSY" and',end),1)
          a='            self.state.update(status="OK", checked_at=clock.isoformat(), cycles=self.state["cycles"]+1,\n';assert s.count(a)==1
          s=s.replace(a,'            self.state.update(status="WAITING_FOR_BOOK" if execution.get("status") == "BUSY" else "OK",\n                              pending_entry_rows=len(self._pending_entry_rows),\n                              checked_at=clock.isoformat(), cycles=self.state["cycles"]+1,\n')
          swap('    def snapshot(self):','    def close(self):')
          a='            self._stop.wait(max(0.05, INTERVAL_SECONDS-(time.monotonic()-started)))\n';assert s.count(a)==1
          s=s.replace(a,'            interval = BOOK_RETRY_SECONDS if self._pending_entry_rows else INTERVAL_SECONDS\n            self._stop.wait(max(0.05, interval-(time.monotonic()-started)))\n')
          # Preserve the exact reviewed comments as well as behavior for hash comparison.
          start='        # A custom builder can still return every historical level.'
          end='        row["timeframe_entry_context"] = public_context\n'
          s=s.replace(block(s,start,end),block(old,'        # Project before copying.',end),1)
          p.write_text(s)
          p=Path('test_veritas_structural_latency.py');p.write_text(p.read_text().replace('SB._first_cross_times(','SB._level_crossing_times('))
          expected={'veritas_breakout_runtime.py':'7528bf5ae3cf6de4834f88176421501f7f29af05','veritas_structural_breakout.py':'16084d743e8584c91b56b1defff32f78278a2b5a','veritas_timeframe_data.py':'63a066aa45a62d426216c48ba78f3427ca05773b','test_veritas_structural_latency.py':'12981b36fe2b5c32a2baa5ad034a567adc684f36'}
          for path,digest in expected.items():
              b=Path(path).read_bytes();actual=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert actual==digest,(path,actual,digest)
          PY
          python -m py_compile veritas_breakout_runtime.py veritas_structural_breakout.py veritas_timeframe_data.py test_veritas_structural_latency.py
          git diff --check
          git config user.name 'VERITAS verified integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veritas_breakout_runtime.py veritas_structural_breakout.py veritas_timeframe_data.py test_veritas_structural_latency.py
          git commit -m 'Materialize exact locally-tested current-main integration source'
          git push origin HEAD:fix/structural-latency-book-20261007
