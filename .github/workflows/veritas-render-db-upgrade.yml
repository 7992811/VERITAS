name: Upgrade VERITAS Render Postgres

on:
  push:
    paths:
      - ".github/workflows/veritas-render-db-upgrade.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Render CLI
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh
          if ! command -v render >/dev/null 2>&1; then
            for p in "$HOME/.local/bin/render" "$HOME/bin/render" /usr/local/bin/render; do
              if [ -x "$p" ]; then
                echo "$(dirname "$p")" >> "$GITHUB_PATH"
                break
              fi
            done
          fi

      - name: Upgrade existing VERITAS Postgres to paid 5GB
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CI: "true"
          RENDER_OUTPUT: "json"
          RENDER_CLI_CONFIG_DIR: "/tmp/render-cli"
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY_MISSING"
            exit 2
          fi
          render workspace set tea-dahn8kjm8hqs73ci751g --confirm --output text
          render pg update dpg-dao4ctp42hec738dab10-a --plan 0.1c-256mb --disk-size-gb 5 --confirm --output json
          render pg resume dpg-dao4ctp42hec738dab10-a --output json || true
          render pg get dpg-dao4ctp42hec738dab10-a --output json

      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/veritas-render-db-upgrade.yml
          git config user.name "VERITAS Render Upgrade"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VERITAS: remove completed Render DB upgrade workflow"
          git push origin HEAD:main
