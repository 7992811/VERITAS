name: VERITAS carry shadow signal

on:
  push:
    branches:
      - research/full-arsenal-20261005
    paths:
      - tools/shadow_carry_signal.py
      - .github/workflows/veritas-carry-shadow.yml
  workflow_dispatch:

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-arsenal-20261005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Run shadow signal
        run: python tools/shadow_carry_signal.py
      - name: Print result
        if: always()
        run: |
          if [ -f carry_shadow_signal_out/result.json ]; then
            cat carry_shadow_signal_out/result.json
          fi
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-carry-shadow-signal
          path: carry_shadow_signal_out/
          retention-days: 14
