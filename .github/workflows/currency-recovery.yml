name: Currency feed recovery regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - run: pip install -r requirements-intelligence.txt
      - run: python -m unittest -v test_veritas_currency_feed_recovery.py test_veritas_tbank.py test_veritas_tbank_order_stream.py
