name: Export pinned integration source
on:
  push:
    branches: [fix/structural-latency-book-20261007]
    paths: [.github/workflows/export-integration-bundle-once.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export commit history only, no credentials or environment
        run: |
          mkdir -p /tmp/veritas-integration-history
          git branch pinned-main-5bf732c 5bf732c4404c777e6f9c0e3cf5d6376b037ef5bc
          git bundle create /tmp/veritas-integration-history/repository.bundle HEAD pinned-main-5bf732c
          git bundle verify /tmp/veritas-integration-history/repository.bundle
          du -h /tmp/veritas-integration-history/repository.bundle
      - uses: actions/upload-artifact@v4
        with:
          name: veritas-integration-history
          path: /tmp/veritas-integration-history/
          retention-days: 1
