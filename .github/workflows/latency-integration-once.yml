name: Integrate latency repair on pinned main
on:
  push:
    branches: [fix/structural-latency-book-20261007]
    paths: [.github/workflows/latency-integration-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - name: Resolve duplicate diagnostic field from three-way merge
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('veritas_breakout_runtime.py');raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='a914866a6327da40b2126d701a4d4f0798714c2d'
          s=raw.decode();old='                              pending_entry_rows=len(self._pending_entry_rows),\n                              execution_reason=execution.get("reason"),\n'
          assert s.count(old)==1
          p.write_text(s.replace(old,'                              pending_entry_rows=len(self._pending_entry_rows),\n'))
          PY
          python -m py_compile veritas_breakout_runtime.py
          git diff --check
          git config user.name 'VERITAS latency integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veritas_breakout_runtime.py
          git commit -m 'Resolve duplicate execution diagnostic after current-main integration'
          git push origin HEAD:fix/structural-latency-book-20261007
      - name: Export exact integrated source for independent local checks
        run: |
          mkdir -p /tmp/latency-integrated
          git archive --format=tar.gz --output=/tmp/latency-integrated/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/latency-integrated/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: veritas-integrated-latency-source
          path: /tmp/latency-integrated
          retention-days: 2
      - run: pip install -r requirements-intelligence.txt
      - name: Integrated invariants
        run: python -m unittest -q test_veritas_data_copy.py test_veritas_structural_latency.py test_veritas_retry_freshness.py test_veritas_structural_breakout.py test_veritas_structural_cny_episodes.py test_veritas_breakout_runtime.py test_veritas_currency_feed_recovery.py test_veritas_structural_lifecycle.py test_veritas_structural_management.py test_veritas_book_lock.py
      - run: python tools/architecture_guard.py
