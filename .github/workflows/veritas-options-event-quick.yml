name: VERITAS options event quick validation

on:
  push:
    branches:
      - research/full-arsenal-20261005
    paths:
      - tools/research_crypto_options_volatility.py
      - tools/research_crypto_event_driven.py
      - .github/workflows/veritas-options-event-quick.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-arsenal-20261005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Download cached minute data
        uses: actions/download-artifact@v4
        with:
          name: veritas-manager-library-result
          path: manager_library_out
          github-token: ${{ github.token }}
          run-id: 37210798801
      - name: Options volatility
        run: python tools/research_crypto_options_volatility.py
      - name: Scheduled events
        run: python tools/research_crypto_event_driven.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-options-event-quick
          path: |
            options_vol_out/
            event_driven_out/
          retention-days: 14
