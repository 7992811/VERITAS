name: Refactor VERITAS storage guard

on:
  push:
    paths:
      - '.github/workflows/veritas-storage-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refactor storage guard into module
        run: python tools/refactor_storage_guard_r43.py

      - name: Verify runtime
        run: |
          pip install -r requirements-intelligence.txt
          python -m py_compile veritas_intelligence.py veritas_storage_guard.py veritas_execution.py veritas_portfolio.py
          python - <<'PY'
          from pathlib import Path
          src=Path('veritas_intelligence.py').read_text(encoding='utf-8')
          assert '# VERITAS V90 STORAGE CIRCUIT BREAKER R42' not in src
          assert 'install_storage_guard' in src
          print('VERITAS_STORAGE_GUARD_R43_VERIFIED')
          PY

      - name: Commit refactor
        run: |
          git config user.name "VERITAS Storage Guard"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VERITAS v9.0: extract storage quota guard from monolith"
          git push origin HEAD:main
