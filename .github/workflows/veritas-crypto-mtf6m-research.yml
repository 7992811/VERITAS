name: VERITAS adaptive crypto momentum research

on:
  push:
    branches:
      - research/crypto-mtf-6m-20261004
    paths:
      - tools/research_crypto_adaptive_momentum.py
      - tools/research_crypto_manager_library.py
      - .github/workflows/veritas-crypto-mtf6m-research.yml
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/crypto-mtf-6m-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Run adaptive volatility-normalized research
        run: python tools/research_crypto_adaptive_momentum.py
      - name: Print compact pass set
        if: always()
        run: |
          if [ -f adaptive_momentum_out/result.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('adaptive_momentum_out/result.json'))
          print('VERITAS_ADAPTIVE_PASSES_COMPACT='+json.dumps({k:v[:3] for k,v in x.get('passes',{}).items()},separators=(',',':')))
          PY
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-adaptive-momentum-result
          path: adaptive_momentum_out/
          retention-days: 7
