name: VERITAS external 2020-2021 holdout

on:
  push:
    branches:
      - research/crypto-mtf-6m-20261004
    paths:
      - tools/research_crypto_external_holdout.py
      - tools/research_crypto_manager_library.py
      - .github/workflows/veritas-crypto-mtf6m-research.yml
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/crypto-mtf-6m-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Run frozen external holdout
        run: python tools/research_crypto_external_holdout.py
      - name: Print compact result
        if: always()
        run: |
          if [ -f external_holdout_out/result.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('external_holdout_out/result.json'))
          print('VERITAS_EXTERNAL_HOLDOUT_COMPACT='+json.dumps(x.get('assets',{}),separators=(',',':')))
          PY
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-external-holdout
          path: external_holdout_out/
          retention-days: 7
