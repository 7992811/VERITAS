name: VERITAS focused ETH-long robustness

on:
  push:
    branches:
      - research/crypto-mtf-6m-20261004
    paths:
      - tools/research_eth_long_neighborhood.py
      - tools/research_crypto_manager_library.py
      - .github/workflows/veritas-crypto-mtf6m-research.yml
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/crypto-mtf-6m-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Run focused ETH long robustness research
        run: python tools/research_eth_long_neighborhood.py
      - name: Print compact pass set
        if: always()
        run: |
          if [ -f eth_long_neighborhood_out/result.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('eth_long_neighborhood_out/result.json'))
          print('ETH_LONG_PASSES_COMPACT='+json.dumps(x.get('passes',[])[:5],separators=(',',':')))
          PY
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-eth-long-neighborhood-result
          path: eth_long_neighborhood_out/
          retention-days: 7
