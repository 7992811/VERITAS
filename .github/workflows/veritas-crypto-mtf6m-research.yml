name: VERITAS hierarchical EV policy research

on:
  push:
    branches:
      - research/crypto-mtf-6m-20261004
    paths:
      - tools/research_crypto_hierarchical_policy.py
      - tools/research_crypto_state_router.py
      - tools/research_crypto_manager_library.py
      - .github/workflows/veritas-crypto-mtf6m-research.yml
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/crypto-mtf-6m-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Download cached minute data
        uses: actions/download-artifact@v4
        with:
          name: veritas-manager-library-result
          path: manager_library_out
          github-token: ${{ github.token }}
          run-id: 37210798801
      - name: Run hierarchical walk-forward EV policy
        run: python tools/research_crypto_hierarchical_policy.py
      - name: Print compact result
        if: always()
        run: |
          if [ -f hierarchical_policy_out/result.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('hierarchical_policy_out/result.json'))
          out={a:{k:v.get(k) for k in ('walkforward','n_final_rules','test_2026','test_stress_5bp','confidence_tiers')} for a,v in x.get('assets',{}).items()}
          print('VERITAS_HIERARCHICAL_POLICY_COMPACT='+json.dumps(out,separators=(',',':')))
          PY
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-hierarchical-policy-result
          path: hierarchical_policy_out/
          retention-days: 7
