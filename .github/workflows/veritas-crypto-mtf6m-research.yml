name: VERITAS macro tactical research

on:
  push:
    branches:
      - research/crypto-mtf-6m-20261004
    paths:
      - tools/research_crypto_macro_tactical.py
      - .github/workflows/veritas-crypto-mtf6m-research.yml
  workflow_dispatch:

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        asset: [BTC, ETH]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/crypto-mtf-6m-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Download 2022-2026 spot cache
        uses: actions/download-artifact@v4
        with:
          name: veritas-manager-library-result
          path: manager_library_out
          github-token: ${{ github.token }}
          run-id: 37210798801
      - name: Download 2020-2021 external cache
        uses: actions/download-artifact@v4
        with:
          name: veritas-external-holdout
          path: external_holdout_out
          github-token: ${{ github.token }}
          run-id: 37268494688
      - name: Run fixed macro tactical system
        run: python tools/research_crypto_macro_tactical.py --asset ${{ matrix.asset }}
      - name: Print result
        if: always()
        run: |
          ASSET_LOWER=$(echo "${{ matrix.asset }}" | tr '[:upper:]' '[:lower:]')
          FILE="macro_tactical_out/${ASSET_LOWER}/result.json"
          if [ -f "$FILE" ]; then
            python - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          print('VERITAS_MACRO_TACTICAL_COMPACT='+json.dumps(x,separators=(',',':')))
          PY
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-macro-tactical-${{ matrix.asset }}
          path: macro_tactical_out/
          retention-days: 7
