name: VERITAS state-conditional EV router research

on:
  push:
    branches:
      - research/crypto-mtf-6m-20261004
    paths:
      - tools/research_crypto_state_router.py
      - tools/research_crypto_manager_library.py
      - .github/workflows/veritas-crypto-mtf6m-research.yml
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/crypto-mtf-6m-20261004
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Run state-conditional EV router
        run: python tools/research_crypto_state_router.py
      - name: Print compact result
        if: always()
        run: |
          if [ -f state_router_out/result.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('state_router_out/result.json'))
          out={a:{'router_2026':v.get('router_2026'),'router_stress_5bp':v.get('router_stress_5bp'),'top_rules':v.get('rules',[])[:5]} for a,v in x.get('assets',{}).items()}
          print('VERITAS_STATE_ROUTER_COMPACT='+json.dumps(out,separators=(',',':')))
          PY
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-state-router-result
          path: state_router_out/
          retention-days: 7
