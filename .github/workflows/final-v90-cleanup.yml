name: Final VERITAS cleanup

on:
  push:
    paths:
      - '.github/workflows/final-v90-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove legacy names and caches
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          # Rename the still-active internal signal library so it is no longer
          # presented as an old product version.
          old = Path('veritas_v70.py')
          new = Path('veritas_signal_core.py')
          if old.exists():
              old.rename(new)

          # Update textual imports/references everywhere in active source.
          for p in Path('.').rglob('*.py'):
              if '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('veritas_v70', 'veritas_signal_core')
              if p.name == 'veritas_signal_core.py':
                  s2 = s2.replace(
                      'VERSION = "veritas-max-product-v84.2-audited-learning-execution"',
                      'VERSION = "veritas-signal-core-v9.0"'
                  )
                  s2 = s2.replace(
                      "VERSION='veritas-max-product-v84.2-audited-learning-execution'",
                      "VERSION='veritas-signal-core-v9.0'"
                  )
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')

          # Remove generated Python caches accidentally committed by the bake.
          for d in list(Path('.').rglob('__pycache__')):
              if d.is_dir():
                  shutil.rmtree(d)

          gi = Path('.gitignore')
          old_gi = gi.read_text(encoding='utf-8') if gi.exists() else ''
          lines = old_gi.splitlines()
          for rule in ['__pycache__/', '*.py[cod]']:
              if rule not in lines:
                  lines.append(rule)
          gi.write_text('\n'.join(lines).rstrip()+'\n', encoding='utf-8')

          wf = Path('.github/workflows/final-v90-cleanup.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Verify only canonical runtime
        run: |
          pip install -r requirements-intelligence.txt
          python -m py_compile veritas_intelligence.py veritas_portfolio.py veritas_v90_ui.py veritas_signal_core.py
          python - <<'PY'
          import veritas_intelligence as vi
          import veritas_portfolio as vp
          import veritas_signal_core as sc
          assert vi.VERSION == 'veritas-max-product-v90.0-four-portfolio-core', vi.VERSION
          assert vp.VERSION == 'veritas-portfolio-v9.0-four-portfolio-core', vp.VERSION
          assert sc.VERSION == 'veritas-signal-core-v9.0', sc.VERSION
          print('FINAL_V90_CLEANUP_OK')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "VERITAS Canonicalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VERITAS v9.0: remove legacy runtime names and caches"
          git push origin HEAD:main
