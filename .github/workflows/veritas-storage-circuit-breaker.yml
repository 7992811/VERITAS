name: Install VERITAS storage circuit breaker

on:
  push:
    paths:
      - '.github/workflows/veritas-storage-circuit-breaker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install hard database quota guard
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('veritas_intelligence.py')
          src=p.read_text(encoding='utf-8')
          marker='# VERITAS V90 STORAGE CIRCUIT BREAKER R42'
          if marker in src:
              print('storage circuit breaker already installed')
          else:
              needles=["if __name__ == '__main__':",'if __name__ == "__main__":']
              positions=[src.rfind(n) for n in needles]
              pos=max(positions)
              if pos < 0:
                  raise SystemExit('main guard not found; refusing unsafe patch')

              block=r'''
# VERITAS V90 STORAGE CIRCUIT BREAKER R42
# Hard fail-safe for small Render Postgres disks. The intellectual capital
# (paper trades/positions, outcomes and durable lessons) remains authoritative.
# Rebuildable telemetry is throttled before the database can reach 100%.
_V90R42_STORAGE_SOFT_BYTES=max(128*1024*1024,int(os.getenv('VERITAS_STORAGE_SOFT_BYTES',str(650*1024*1024))))
_V90R42_STORAGE_HARD_BYTES=max(_V90R42_STORAGE_SOFT_BYTES+64*1024*1024,
                               int(os.getenv('VERITAS_STORAGE_HARD_BYTES',str(800*1024*1024))))
_V90R42_STORAGE_CHECK_SECONDS=max(60,int(os.getenv('VERITAS_STORAGE_CHECK_SECONDS','300')))
_v90r42_storage_state={'checked_at':0.0,'bytes':None,'tier':'UNKNOWN','last_emitted':None}
_v90r42_retention_state={'last_at':0.0}

_V90R42_AMBER_DROP={
    'decision','meta_signal','setup_learning','admission_learning',
    'trade_counterfactual_lab','impulse_genesis_learning'
}
_V90R42_RED_DROP=_V90R42_AMBER_DROP | {'profitability_learning'}


def _v90r42_storage_guard(force=False):
    now_ts=time.time()
    if (not force and now_ts-float(_v90r42_storage_state.get('checked_at') or 0.0)
            < _V90R42_STORAGE_CHECK_SECONDS):
        return dict(_v90r42_storage_state)
    out={'checked_at':now_ts,'bytes':None,'tier':'UNKNOWN'}
    if not DATABASE_URL or psycopg is None:
        _v90r42_storage_state.update(out)
        return dict(_v90r42_storage_state)
    try:
        with psycopg.connect(DATABASE_URL,autocommit=True,connect_timeout=3) as c:
            c.execute("SET statement_timeout='3000ms'")
            row=c.execute('SELECT pg_database_size(current_database())::bigint').fetchone()
            used=int(row[0] if row else 0)
        tier='RED' if used>=_V90R42_STORAGE_HARD_BYTES else ('AMBER' if used>=_V90R42_STORAGE_SOFT_BYTES else 'GREEN')
        out.update({'bytes':used,'tier':tier})
    except Exception:
        # Availability is diagnosed by the canonical Postgres health layer.
        # Never turn an unknown size into a destructive cleanup decision.
        out['tier']='UNKNOWN'
    previous=_v90r42_storage_state.get('tier')
    _v90r42_storage_state.update(out)
    if out['tier']!=previous or out['tier'] in ('AMBER','RED'):
        if _v90r42_storage_state.get('last_emitted')!=(out['tier'],out.get('bytes')):
            try:
                emit('v90_storage_quota_guard',tier=out['tier'],database_bytes=out.get('bytes'),
                     soft_bytes=_V90R42_STORAGE_SOFT_BYTES,hard_bytes=_V90R42_STORAGE_HARD_BYTES)
            except Exception:
                pass
            _v90r42_storage_state['last_emitted']=(out['tier'],out.get('bytes'))
    return dict(_v90r42_storage_state)


_v90r42_pg_event_base=pg_event
def pg_event(event_type,entity_key,payload,asset=None,horizon=None,event_ts=None):
    st=_v90r42_storage_guard()
    et=str(event_type or '')
    if st.get('tier')=='RED' and et in _V90R42_RED_DROP:
        return True
    if st.get('tier')=='AMBER' and et in _V90R42_AMBER_DROP:
        return True
    return _v90r42_pg_event_base(event_type,entity_key,payload,asset,horizon,event_ts)


_v90r42_snapshot_base=save_product_snapshot
def save_product_snapshot():
    st=_v90r42_storage_guard()
    if st.get('tier') in ('AMBER','RED'):
        return
    return _v90r42_snapshot_base()


_v90r42_retention_base=_v90r37_storage_retention
def _v90r37_storage_retention():
    st=_v90r42_storage_guard(force=True)
    now_ts=time.time()
    if st.get('tier') in ('AMBER','RED'):
        # Force bounded retention at most every 30 minutes while space is tight.
        if now_ts-float(_v90r42_retention_state.get('last_at') or 0.0) < 1800:
            return {'status':'NOT_DUE_QUOTA_GUARD','tier':st.get('tier'),'database_bytes':st.get('bytes')}
        _v90r42_retention_state['last_at']=now_ts
        try:
            _v90r37_maintenance_state['last']=0.0
        except Exception:
            pass
    return _v90r42_retention_base()


def _v90r42_startup_space_reclaim():
    st=_v90r42_storage_guard(force=True)
    if st.get('tier') not in ('AMBER','RED'):
        return {'status':'NOT_NEEDED','tier':st.get('tier'),'database_bytes':st.get('bytes')}
    reclaimed=[]
    try:
        with psycopg.connect(DATABASE_URL,autocommit=True,connect_timeout=5) as c:
            c.execute("SET statement_timeout='8000ms'")
            # Only derived/rebuildable tables are physically truncated.
            for schema in ('veritas_v90','public'):
                for table in ('product_snapshots','model_drift_snapshots','macro_snapshots','visitor_sessions'):
                    reg=f'{schema}.{table}'
                    try:
                        row=c.execute('SELECT to_regclass(%s)',(reg,)).fetchone()
                        if row and row[0]:
                            c.execute(f'TRUNCATE TABLE "{schema}"."{table}" RESTART IDENTITY')
                            reclaimed.append(reg)
                    except Exception:
                        pass
            # Keep recent operational history; remove only stale rebuildable rows.
            for schema,table,col,interval in (
                ('veritas_v90','paper_nav_history','observed_at','3 days'),
                ('veritas_v90','product_alerts','created_at','3 days'),
                ('public','paper_nav_history','observed_at','3 days'),
                ('public','product_alerts','created_at','3 days'),
            ):
                try:
                    row=c.execute('SELECT to_regclass(%s)',(f'{schema}.{table}',)).fetchone()
                    if row and row[0]:
                        c.execute(f'DELETE FROM "{schema}"."{table}" WHERE "{col}" < NOW() - INTERVAL \'{interval}\'')
                except Exception:
                    pass
        _v90r42_storage_guard(force=True)
        try:
            emit('v90_storage_startup_reclaim',status='OK',truncated=reclaimed,
                 database_bytes=_v90r42_storage_state.get('bytes'),tier=_v90r42_storage_state.get('tier'))
        except Exception:
            pass
        return {'status':'OK','truncated':reclaimed,'database_bytes':_v90r42_storage_state.get('bytes')}
    except Exception as ex:
        try:
            emit('v90_storage_startup_reclaim',status='ERROR',error=f'{type(ex).__name__}: {ex}')
        except Exception:
            pass
        return {'status':'ERROR','error':f'{type(ex).__name__}: {ex}'}


# Run only after all canonical storage functions have been defined, and before main().
try:
    _v90r42_startup_space_reclaim()
except Exception:
    pass
'''
              src=src[:pos]+block+'\n\n'+src[pos:]
              p.write_text(src,encoding='utf-8')
              print('VERITAS_STORAGE_CIRCUIT_BREAKER_R42_INSTALLED')

          # Remove this one-shot workflow after applying the patch.
          wf=Path('.github/workflows/veritas-storage-circuit-breaker.yml')
          if wf.exists():
              wf.unlink()
          PY

      - name: Verify runtime
        run: |
          pip install -r requirements-intelligence.txt
          python -m py_compile veritas_intelligence.py veritas_execution.py veritas_portfolio.py
          python - <<'PY'
          from pathlib import Path
          src=Path('veritas_intelligence.py').read_text(encoding='utf-8')
          assert '# VERITAS V90 STORAGE CIRCUIT BREAKER R42' in src
          assert 'VERITAS_STORAGE_SOFT_BYTES' in src
          assert 'VERITAS_STORAGE_HARD_BYTES' in src
          print('VERITAS_STORAGE_GUARD_VERIFIED')
          PY

      - name: Commit storage guard
        run: |
          git config user.name "VERITAS Storage Guard"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VERITAS v9.0: add hard Postgres quota circuit breaker"
          git push origin HEAD:main
