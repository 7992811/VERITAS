name: R46 Snapshot Debug
on:
  push:
    branches: [ "debug/r46-five-portfolio-e7cb36f" ]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - run: pip install -r requirements-intelligence.txt
      - name: Trace R46 borrowed snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json, traceback, sys
          import test_veritas_r46_snapshot_borrowing as T
          import veritas_portfolio_runtime as R
          original_builder=T.r46_wrapper
          def builder(namespace,legacy=False):
              for key in ('_portfolio_rows','_mark_nav','_v90j_update_excursions',
                          '_v90r46_mark_trend_hold','_v90r46_giveback_harvest'):
                  original=namespace[key]
                  def wrapped(*args,__key=key,__original=original,**kwargs):
                      c=args[0] if args else None
                      print("CALL="+__key,file=sys.stderr)
                      try:
                          out=__original(*args,**kwargs)
                      except Exception as exc:
                          print("RAISE="+__key+":"+type(exc).__name__+":"+str(exc),file=sys.stderr)
                          raise
                      if __key=='_v90r46_giveback_harvest':
                          print("HARVEST_RESULT="+json.dumps(out,default=str,sort_keys=True),file=sys.stderr)
                          print("AFTER="+json.dumps(c.position,default=str,sort_keys=True),file=sys.stderr)
                      return out
                  namespace[key]=wrapped
              return original_builder(namespace,legacy)
          T.r46_wrapper=builder
          case=T.R46WrapperBorrowingTests()
          try:
              print(case.run_passes(False))
          except Exception:
              traceback.print_exc()
              raise
          PY
