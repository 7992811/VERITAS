name: R46 Snapshot Debug
on:
  push:
    branches: [ "debug/r46-five-portfolio-e7cb36f" ]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - run: pip install -r requirements-intelligence.txt
      - name: Trace R46 borrowed snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json, traceback, sys
          import test_veritas_r46_snapshot_borrowing as T
          import veritas_portfolio_runtime as R
          orig=R._v90r46_giveback_harvest
          def traced(*args,**kwargs):
              c=args[0]
              print("BEFORE="+json.dumps(c.position,default=str,sort_keys=True),file=sys.stderr)
              out=orig(*args,**kwargs)
              print("HARVEST_RESULT="+json.dumps(out,default=str,sort_keys=True),file=sys.stderr)
              print("AFTER="+json.dumps(c.position,default=str,sort_keys=True),file=sys.stderr)
              print("WRITES="+json.dumps(c.writes,default=str),file=sys.stderr)
              return out
          R._v90r46_giveback_harvest=traced
          case=T.R46WrapperBorrowingTests()
          try:
              print(case.run_passes(False))
          except Exception:
              traceback.print_exc()
              raise
          PY
