name: Bake canonical VERITAS v9.0

on:
  push:
    paths:
      - '.github/workflows/bake-v90-canonical.yml'

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: pip install -r requirements-intelligence.txt

      - name: Materialize current v9.0
        run: |
          python -c "import sitecustomize"
          python - <<'PY'
          from pathlib import Path
          import re

          intel = Path("veritas_intelligence.py")
          port = Path("veritas_portfolio.py")

          s = intel.read_text(encoding="utf-8")
          p = port.read_text(encoding="utf-8")

          assert "veritas-max-product-v90.0-four-portfolio-core" in s, "v9 intelligence was not materialized"
          assert "veritas-portfolio-v9.0-four-portfolio-core" in p, "v9 portfolio was not materialized"

          # Remove temporary runtime-export endpoint from the baked canonical source.
          s = re.sub(
              r"\n\s*elif self\.path\.startswith\('/internal/v90-runtime-export-7e2c91/intelligence'\):.*?"
              r"(?=\n\s*elif self\.path\.startswith\('/healthz'\):)",
              "",
              s,
              flags=re.S,
          )

          intel.write_text(s, encoding="utf-8")

          # Legacy bootstrap/overlay are no longer part of the canonical runtime.
          for old in ["sitecustomize.py", "veritas_v90_overlay.py"]:
              q = Path(old)
              if q.exists():
                  q.unlink()

          # The workflow is one-shot and removes itself from the canonical tree.
          wf = Path(".github/workflows/bake-v90-canonical.yml")
          if wf.exists():
              wf.unlink()
          PY

      - name: Verify canonical direct runtime
        run: |
          python -m py_compile veritas_intelligence.py veritas_portfolio.py veritas_v90_ui.py
          python - <<'PY'
          import veritas_intelligence as vi
          import veritas_portfolio as vp
          assert vi.VERSION == "veritas-max-product-v90.0-four-portfolio-core", vi.VERSION
          assert vp.VERSION == "veritas-portfolio-v9.0-four-portfolio-core", vp.VERSION
          print("CANONICAL_V90_OK")
          PY

      - name: Commit canonical runtime
        run: |
          git config user.name "VERITAS Canonicalizer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "VERITAS v9.0: canonical runtime without legacy bootstrap"
          git push origin HEAD:main
