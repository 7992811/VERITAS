name: VERITAS Safety CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      quality-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_test_only
          POSTGRES_DB: veritas_quality_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veritas_quality_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - name: Install runtime dependencies
        run: pip install -r requirements-intelligence.txt
      - name: Compile canonical runtime
        run: python -m py_compile veritas_daily_averages.py veritas_native_daily.py veritas_ma_rebound.py veritas_brent_market.py veritas_entry_scenarios.py veritas_feature_history.py veritas_direct_cny.py veritas_strategy_quality.py veritas_trade_audit.py veritas_trade_diagnostics.py veritas_observation_path.py veritas_launch_readiness.py veritas_entry_comparison.py veritas_learning_integrity.py veritas_learning_exports.py veritas_strategy_roles.py veritas_canonical_constitution.py veritas_canonical_runtime.py veritas_release.py veritas_quote_time.py veritas_profit_protection.py veritas_position_guard.py veritas_protective_io.py veritas_execution.py veritas_broker.py veritas_instruments.py veritas_promotion.py veritas_risk.py veritas_live.py veritas_storage_guard.py veritas_market_runtime.py veritas_signal_core.py veritas_decision_signature.py veritas_learning_memory.py veritas_asset_management_intelligence.py veritas_portfolio.py veritas_portfolio_runtime.py veritas_intelligence.py veritas_learning_index.py veritas_v90_ui.py
      - name: Compile immutable version provenance and execution boundaries
        run: python -m py_compile veritas_entry_version.py veritas_execution_snapshot.py veritas_execution_journal.py veritas_paper_entry.py veritas_position_thesis.py veritas_stop_risk.py veritas_timeframe_management.py
      - name: Quote breakout lifecycle and actual CNY episode regressions
        run: python -m unittest -v test_veritas_structural_breakout.py test_veritas_structural_facts_cache.py test_veritas_structural_cny_episodes.py test_veritas_breakout_runtime.py test_veritas_cny_source_recovery.py test_veritas_last_confirmed_swing.py test_veritas_weighted_structural_economics.py test_veritas_structural_lifecycle.py test_veritas_structural_management.py test_veritas_source_identity_roundtrip.py test_veritas_monolith_structural_quote.py
      - name: Timeframe diagnosis, path evidence and signal latency
        run: python -m unittest -v test_veritas_trade_diagnostics.py test_veritas_observation_path.py test_veritas_observation_runtime.py test_veritas_launch_readiness.py test_veritas_signal_latency.py test_veritas_entry_comparison.py test_veritas_cycle_telemetry.py
      - name: Bounded background maintenance and execution logging
        run: |
          python -m py_compile veritas_maintenance.py veritas_execution_logging.py
          python -m unittest -v test_veritas_maintenance.py test_veritas_maintenance_integration.py test_veritas_maintenance_periodic.py test_veritas_execution_logging.py
      - name: Autonomous learning and durable restart integration
        env:
          VERITAS_QUALITY_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test
        run: |
          python -m py_compile veritas_learning_state.py veritas_autonomous_learning.py veritas_learning_bridge.py veritas_continuous_learning.py veritas_trade_learning.py veritas_learning_measurement.py veritas_knowledge_discovery.py veritas_knowledge_validation.py
          python -m unittest -v test_veritas_learning_state.py test_veritas_autonomous_learning.py test_veritas_learning_bridge.py test_veritas_continuous_learning.py test_veritas_learning_runtime.py test_veritas_quote_learning.py test_veritas_trade_learning.py test_veritas_knowledge_discovery.py test_veritas_knowledge_validation.py
      - name: Create isolated Currency trading test database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test", autocommit=True) as conn:
              conn.execute("CREATE DATABASE ci_ephemeral_test_only")
          PY
      - name: Currency broker and approval regressions (fake broker only)
        env:
          VERITAS_TRADING_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/ci_ephemeral_test_only
        run: |
          python -m py_compile veritas_currency_trade_plan.py veritas_currency_trading.py veritas_trade_telegram.py veritas_trade_approvals.py veritas_tbank_trading.py veritas_currency_trade_ledger.py veritas_currency_trade_funding.py veritas_currency_trade_service.py veritas_currency_trade_console.py veritas_currency_console_telegram.py veritas_currency_trade_ui.py veritas_currency_live_admission.py veritas_currency_settlement.py bot.py
          python -m unittest -v test_veritas_tbank_trading.py test_veritas_trade_approvals.py test_veritas_currency_trading.py test_veritas_currency_trade_ledger.py test_veritas_trade_telegram.py test_veritas_currency_trade_facts.py test_veritas_currency_trade_service.py test_veritas_currency_ma_trading.py test_veritas_currency_structural_trading.py test_veritas_currency_reviewed_entry.py test_veritas_currency_live_admission.py test_veritas_currency_trade_funding.py test_veritas_currency_settlement.py test_veritas_currency_execution_guard.py test_veritas_currency_trade_console.py test_veritas_currency_console_telegram.py test_veritas_currency_trade_ui.py
          node tools/test_currency_trade_ui.cjs
      - name: Durable evidence learning recovery and PostgreSQL exclusion
        env:
          VERITAS_QUALITY_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test
        run: python -m unittest -v test_veritas_evidence_learning.py
      - name: Execution quality and direct CNY regressions
        run: python -m unittest -v test_veritas_execution_quality.py test_veritas_trade_audit.py test_veritas_direct_cny_snapshot.py test_veritas_profit_exit_authority.py test_veritas_ma_learning_evidence.py
      - name: Independent portfolio accounting and protective handoff
        run: |
          python -m py_compile veritas_book_lock.py veritas_portfolio_cycle.py veritas_accounting_io.py veritas_book_storage.py veritas_quality_history.py veritas_protection_read_model.py veritas_book_marking.py
          python -m unittest -v test_veritas_book_lock.py test_veritas_portfolio_cycle.py test_veritas_accounting_io.py test_veritas_book_storage.py test_veritas_quality_runtime.py test_veritas_r46_snapshot_borrowing.py test_veritas_protection_runtime.py test_veritas_book_marking.py
      - name: Verified fills, source locks, position thesis and complete stop risk
        run: python -m unittest -v test_veritas_execution_snapshot.py test_veritas_exit_snapshot.py test_veritas_price_source_lock.py test_veritas_position_thesis.py test_veritas_net_stop_risk.py
      - name: Strategy evidence PostgreSQL integration
        env:
          VERITAS_QUALITY_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test
        run: python -m unittest -v test_veritas_strategy_quality_sql.py test_veritas_portfolio_cycle_sql.py test_veritas_legacy_position_reads.py test_veritas_book_read_elision.py test_veritas_book_storage_sql.py test_veritas_toast_compression_sql.py test_veritas_excursion_projection_sql.py test_veritas_profit_protection_projection_sql.py test_veritas_guard_accounting_projection_sql.py test_veritas_guard_observation_batch_sql.py test_veritas_quote_projection_sql.py test_veritas_protection_runtime_sql.py test_veritas_book_marking_sql.py test_veritas_learning_integrity_sql.py test_veritas_learning_index_sql.py test_veritas_learning_exports.py test_veritas_ma_learning_projection_sql.py test_veritas_observation_sql.py test_veritas_memory_projection.py test_veritas_trend_memory_sql.py test_veritas_snapshot_memory_sql.py test_veritas_timeframe_management_sql.py test_veritas_calibration_memory_sql.py test_veritas_portfolio_schema.py test_veritas_startup_guard.py test_veritas_trade_journal_read_model.py
      - name: Owner timeframe structure and provenance regressions
        run: python -m unittest -v test_veritas_timeframe_structure.py test_veritas_timeframe_policy.py test_veritas_timeframe_data.py test_veritas_timeframe_management.py test_veritas_profinance_history.py test_veritas_user_teaching.py test_veritas_repeat_add.py
      - name: Signal readiness, original admission evidence and candle refresh
        run: python -m unittest -v test_veritas_admission_trace.py test_veritas_cycle_schedule.py test_veritas_history_recovery.py test_veritas_signal_readiness.py test_veritas_signal_publication.py test_veritas_timeframe_source_aggregation.py
      - name: Native daily averages, rebounds and stable Brent source
        run: python -m unittest -v test_veritas_daily_averages.py test_veritas_daily_average_index.py test_veritas_native_daily.py test_veritas_ma_rebound.py test_veritas_brent_market.py test_veritas_entry_scenarios.py test_veritas_profinance_daily_integration.py
      - name: Brent valuation identity and exact held contract
        env:
          VERITAS_QUALITY_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test
        run: |
          python -m unittest -v test_veritas_brent_valuation.py test_veritas_brent_contract_guard.py test_veritas_profinance_protocol.py test_veritas_brent_source_pin.py test_veritas_brent_runtime_pin.py test_veritas_brent_persistence.py
          node tools/test_brent_valuation_ui.cjs
      - name: Canonical constitution regressions
        run: python -m unittest -v test_veritas_canonical_constitution.py
      - name: CTC v2 architecture regressions
        run: python -m unittest -v test_veritas_architecture_v2.py
      - name: Canonical cost policy regressions
        run: python -m unittest -v test_veritas_r82_cost_policy.py test_veritas_cost_audit_repairs.py
      - name: Currency portfolio regressions
        run: python -m unittest -v test_veritas_currency_portfolio.py test_veritas_currency_dashboard_loading.py test_veritas_partial_portfolio_refresh.py test_veritas_portfolio_read_model.py
      - name: Bounded portfolio delivery and matching accounting snapshot
        env:
          VERITAS_QUALITY_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test
        run: python -m unittest -v test_veritas_portfolio_snapshot_refresh.py test_veritas_guard_cache_revision.py test_veritas_portfolio_api_projection.py
      - name: Currency routing and Telegram event delivery
        run: python -m unittest -v test_veritas_currency_rule_consistency.py test_veritas_currency_notifications.py test_veritas_currency_delivery.py test_veritas_currency_flip.py
      - name: T-Invest read-only connection tests
        run: python -m unittest -v test_veritas_tbank.py
      - name: Execution safety tests
        run: python -m unittest -v test_veritas_v90_safety.py test_veritas_memory_runtime.py test_veritas_memory_reclaim.py test_veritas_r80_snapshot_lifetimes.py test_veritas_portfolio_prepass_lifetimes.py test_veritas_dashboard_snapshot_lifetimes.py
      - name: Market case regressions
        run: python -m unittest -v test_veritas_v90_market_cases.py
      - name: GOLD source and senior-thesis regressions
        run: python -m unittest -v test_veritas_gold_profinance.py test_veritas_thesis_guard.py
      - name: Single-source policy regressions
        run: python -m unittest -v test_veritas_single_source.py
      - name: Learning index regressions
        run: python -m unittest -v test_veritas_learning_index.py
      - name: Asset-management intelligence regressions
        env:
          VERITAS_QUALITY_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test
        run: python -m unittest -v test_veritas_management_intelligence.py test_veritas_scorecard_delivery.py test_veritas_scorecard_daily.py
      - name: Paper signal UI regressions
        run: |
          node tools/test_paper_ui.cjs
          node tools/test_paper_action_status.cjs
          node tools/test_learning_ui.cjs
      - name: Forecast versus actual entry UI regressions
        run: node tools/test_signal_readiness_ui.cjs
      - name: Trade accounting view regressions
        run: python -m unittest -v test_veritas_trade_view.py
      - name: Net profit protection regressions
        run: python -m unittest -v test_veritas_profit_protection.py
      - name: Execution regression audit
        run: python -m unittest -v test_veritas_execution_repairs.py test_veritas_trend_entry.py
      - name: Architecture debt guard
        run: python tools/architecture_guard.py

  learning-sql:
    name: Learning SQL runtime regressions
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      learning-postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_test_only
          POSTGRES_DB: veritas_quality_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veritas_quality_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - name: Install runtime dependencies
        run: pip install -r requirements-intelligence.txt
      - name: Native learning proof and startup history regressions
        env:
          VERITAS_QUALITY_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test
        run: python -m unittest -v test_veritas_learning_integrity_sql.py test_veritas_learning_index_sql.py
