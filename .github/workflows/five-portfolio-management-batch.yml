name: Five Portfolio Management Batch CI
on:
  push:
    branches: [ "ci/five-portfolio-management-batch-9e1d525" ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_test_only
          POSTGRES_DB: veritas_quality_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d veritas_quality_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - run: pip install -r requirements-intelligence.txt
      - name: Compile management batch runtime
        run: python -m py_compile veritas_book_marking.py veritas_protective_io.py veritas_portfolio_runtime.py
      - name: R80 management and source-lock regressions
        run: python -m unittest -v test_veritas_r80_snapshot_lifetimes.py test_veritas_price_source_lock.py test_veritas_timeframe_management.py
      - name: PostgreSQL mark batch and mirrored-patch parity
        env:
          VERITAS_QUALITY_TEST_DSN: postgresql://postgres:ci_ephemeral_test_only@localhost:5432/veritas_quality_test
        run: python -m unittest -v test_veritas_book_marking_sql.py test_veritas_guard_observation_batch_sql.py
