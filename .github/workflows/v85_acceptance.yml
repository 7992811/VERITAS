# Place in .github/workflows/v85_acceptance.yml on branch v85-acceptance.
# CI3: preserves the exact reviewed v78.1 version repeat; retains all source and test gates.
# Trading code, main, Render and the production database are not changed.
name: VERITAS v85 acceptance
on:
  push:
    branches: [v85-acceptance]
    paths:
      - VERITAS_v85_INTEGRATION_RC2_FOR_CI.zip
      - .github/workflows/v85_acceptance.yml
permissions:
  contents: read
concurrency:
  group: veritas-v85-acceptance
  cancel-in-progress: true
jobs:
  acceptance:
    if: github.ref == 'refs/heads/v85-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: veritas_v85_ci
          POSTGRES_USER: veritas_test
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U veritas_test -d veritas_v85_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VERITAS_V85_TEST_DATABASE_URL: postgresql://veritas_test:ci_ephemeral_only@127.0.0.1:5432/veritas_v85_ci
      VERITAS_V85_EPHEMERAL_DB: '1'
      VERITAS_KNOWLEDGE_AUTOMATION: '0'
      DATABASE_URL: ''
    steps:
      - name: Read acceptance branch, without keeping write credentials
        uses: actions/checkout@v4
        with:
          path: uploaded
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and extract the exact RC2 archive outside the old application
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          python -I - <<'PY'
          import hashlib, os, shutil, stat, zipfile
          from pathlib import Path, PurePosixPath

          if os.environ.get("GITHUB_REF") != "refs/heads/v85-acceptance":
              raise SystemExit("REFUSED: acceptance branch only; main is not a test target")
          archive = Path(os.environ["GITHUB_WORKSPACE"]) / "uploaded" / "VERITAS_v85_INTEGRATION_RC2_FOR_CI.zip"
          if not archive.is_file():
              raise SystemExit("Upload VERITAS_v85_INTEGRATION_RC2_FOR_CI.zip to the ROOT of branch v85-acceptance, without extracting or renaming it")
          expected = "91549748f7065f4d4083827351774983b96c6032d706f459e004d36a67829c8f"
          if archive.stat().st_size > 10_000_000:
              raise SystemExit("REFUSED: unexpected archive size")
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("REFUSED: archive checksum differs from the reviewed RC2 package")
          destination = Path(os.environ["RUNNER_TEMP"]) / "veritas-v85-ci"
          if destination.exists():
              raise SystemExit("REFUSED: extraction directory already exists")
          prefix = "VERITAS_v85_INTEGRATION_RC2"
          with zipfile.ZipFile(archive) as z:
              members = z.infolist()
              if len(members) > 1000 or sum(m.file_size for m in members) > 50_000_000:
                  raise SystemExit("REFUSED: excessive archive contents")
              seen = set()
              for member in members:
                  path = PurePosixPath(member.filename)
                  mode = stat.S_IFMT(member.external_attr >> 16)
                  if (path.is_absolute() or ".." in path.parts or "\\" in member.filename
                          or not path.parts or path.parts[0] != prefix
                          or mode not in (0, stat.S_IFREG, stat.S_IFDIR)
                          or member.filename in seen):
                      raise SystemExit("REFUSED: unsafe or duplicate archive entry")
                  seen.add(member.filename)
              destination.mkdir(parents=True)
              z.extractall(destination)
          root = destination / prefix
          for required in ("tools/build_release.py", "tools/run_checks.py", "ci_tests/test_postgres.py",
                           "tools/run_http_smoke.py", "tools/package_release.py", "veritas_v85/application.py"):
              if not (root / required).is_file():
                  raise SystemExit("Missing release component: " + required)
          # Old evidence is not a pass for this new run. Only regenerated reports are published.
          shutil.rmtree(root / "reports", ignore_errors=True)
          (root / "reports").mkdir()
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              stream.write("V85_ROOT=" + str(root) + "\n")
          print("Validated archive SHA256:", expected)
          print("Isolated source:", root)
          print("The checkout, production settings and production database were not modified")
          PY
      - name: Install isolated test dependencies
        working-directory: ${{ env.V85_ROOT }}
        run: python -m pip install -r requirements-test.txt
      - name: Correct and regression-test the exact RC2 historical build
        working-directory: ${{ env.V85_ROOT }}
        shell: bash
        run: |
          python -I - <<'PY_CI_FIX'
          """Correct RC2 build accounting only, inside the isolated extracted CI workspace."""
          from pathlib import Path
          import ast
          import hashlib
          import json
          from collections import Counter
          
          root = Path.cwd()
          builder = root / 'tools/build_release.py'
          original = builder.read_text(encoding='utf-8')
          expected = '59cbed16c0795f4df7330b1177355eca5f504612227daba8d1c3e56d4a9aeecf'
          if hashlib.sha256(builder.read_bytes()).hexdigest() != expected:
              raise SystemExit('REFUSED: the RC2 build script differs from the reviewed input')
          
          helper = '''
          def validated_patch_tables(text):
              """Partition the exact hash-pinned literal tables without guessing row counts.
          
              The caller checks the complete historical Git blob BEFORE calling this function.
              No code from the historical file is executed. Every row is retained, and all
              resulting source anchors must still apply successfully via apply_table().
              """
              from collections import Counter
              intelligence = table(text, 'PATCHES')
              portfolio = table(text, 'PORTFOLIO_PATCHES')
              if not intelligence or not portfolio:
                  raise RuntimeError('Empty historical patch table')
              source_rows = intelligence + portfolio
              if any(not old or not new or not label for old, new, label in source_rows):
                  raise RuntimeError('Empty historical transformation or label')
              # Descriptions are not row identities. The hash-pinned file contains
              # exactly the same v78.1 VERSION transition in both literal tables.
              # Keep BOTH occurrences: after relocation, the second is idempotent.
              repeatable_version = (
                  "VERSION = 'veritas-max-product-v78.0-impulse-portfolio-consistency'",
                  "VERSION = 'veritas-max-product-v78.1-rule-experience-arbitration'",
                  'v78.1 runtime version',
              )
              labels = [row[2] for row in source_rows]
              duplicates = {label: count for label, count in Counter(labels).items() if count > 1}
              for label, count in duplicates.items():
                  matching = [row for row in source_rows if row[2] == label]
                  if (label != repeatable_version[2] or count != 2
                          or any(row != repeatable_version for row in matching)
                          or intelligence.count(repeatable_version) != 1
                          or portfolio.count(repeatable_version) != 1):
                      raise RuntimeError('Unreviewed duplicate historical patch: ' + label)
              move_labels = {
                  'v78.1 rule experience arbitration engine',
                  'v78.1 knowledge conflict arbitration integration',
                  'v78.1 system rule arbitration integration',
                  'v78.1 runtime version',
              }
              misplaced = [r for r in portfolio if r[2].startswith('v78.1')]
              if len(misplaced) != 4 or {r[2] for r in misplaced} != move_labels:
                  raise RuntimeError('Unexpected v78.1 migration labels')
              if any(r[2] in move_labels and r != repeatable_version for r in intelligence):
                  raise RuntimeError('v78.1 implementation already present in both input tables')
              boundary = next((i for i, r in enumerate(intelligence)
                               if r[2].startswith('v79.0')), None)
              if boundary is None:
                  raise RuntimeError('Missing v79.0 dependency boundary')
              cleaned_portfolio = [r for r in portfolio if r[2] not in move_labels]
              ordered_intelligence = intelligence[:boundary] + misplaced + intelligence[boundary:]
              result_rows = ordered_intelligence + cleaned_portfolio
              if Counter(source_rows) != Counter(result_rows):
                  raise RuntimeError('Historical transformation lost or duplicated')
              if len(ordered_intelligence) != len(intelligence) + len(misplaced):
                  raise RuntimeError('Intelligence transformation accounting failed')
              if len(cleaned_portfolio) != len(portfolio) - len(misplaced):
                  raise RuntimeError('Portfolio transformation accounting failed')
              accounting = {
                  'input_intelligence_rows': len(intelligence),
                  'input_portfolio_rows': len(portfolio),
                  'moved_v78_1_rows': len(misplaced),
                  'output_intelligence_rows': len(ordered_intelligence),
                  'output_portfolio_rows': len(cleaned_portfolio),
                  'all_original_transformations_preserved': True,
                  'reviewed_repeated_labels': duplicates,
                  'row_identity_policy': 'original_table_and_ordinal_not_description',
                  'input_occurrences': [
                      {'id': table_name + ':' + str(i), 'label': row[2]}
                      for table_name, rows in (('PATCHES', intelligence), ('PORTFOLIO_PATCHES', portfolio))
                      for i, row in enumerate(rows)
                  ],
                  'intelligence_labels': [r[2] for r in ordered_intelligence],
                  'portfolio_labels': [r[2] for r in cleaned_portfolio],
              }
              return ordered_intelligence, cleaned_portfolio, accounting
          
          
          def check_historical_runtime(source, expected_version):
              versions = []
              for node in ast.parse(source).body:
                  if isinstance(node, ast.Assign) and any(
                          isinstance(t, ast.Name) and t.id == 'VERSION' for t in node.targets):
                      versions.append(ast.literal_eval(node.value))
              if versions != [expected_version]:
                  raise RuntimeError('Unexpected assembled VERSION: ' + repr(versions))
          
          '''
          
          old = '''        text=payload.decode('utf-8'); ip=table(text,'PATCHES'); pp=table(text,'PORTFOLIO_PATCHES')
                  moved=[x for x in pp if x[2].startswith('v78.1')]
                  if len(moved)!=4: raise RuntimeError('Unexpected v78.1 table structure')
                  pp=[x for x in pp if x not in moved]
                  k=next(i for i,x in enumerate(ip) if x[2].startswith('v79.0'))
                  ip[k:k]=moved
                  if len(ip)!=50 or len(pp)!=24:raise RuntimeError("Unexpected cumulative patch counts")'''
          new = '''        text=payload.decode('utf-8')
                  # Preserve the exact already hash-verified source for complete reproduction,
                  # even when a later source anchor fails. No credentials are included.
                  (ROOT/'reports/historical_dependency.source.txt').write_bytes(payload)
                  ip,pp,accounting=validated_patch_tables(text)
                  accounting['historical_git_blob']=actual
                  accounting['historical_sha256']=hashlib.sha256(payload).hexdigest()
                  (ROOT/'reports/historical_patch_accounting.json').write_text(
                      json.dumps(accounting,indent=2),encoding='utf-8')
                  print('Verified historical patch accounting:',json.dumps({
                      k:v for k,v in accounting.items() if not k.endswith('_labels')}),flush=True)'''
          if original.count(old) != 1:
              raise SystemExit('REFUSED: build-accounting replacement is not unique')
          patched = original.replace(old, new, 1)
          anchor = 'def apply_table(src,rows,log):'
          if patched.count(anchor) != 1:
              raise SystemExit('REFUSED: helper insertion is not unique')
          patched = patched.replace(anchor, helper + '\n' + anchor, 1)
          old_version = "        if 'veritas-max-product-v80.0-unified-execution-core' not in inputs['veritas_intelligence.py']: raise RuntimeError('v80 not established')"
          new_version = """        check_historical_runtime(inputs['veritas_intelligence.py'],
                                           'veritas-max-product-v80.0-unified-execution-core')
                  check_historical_runtime(inputs['veritas_portfolio.py'],
                                           'veritas-portfolio-v6-v80-unified-execution')
                  if len(logs) != len(ip) + len(pp):
                      raise RuntimeError('Not every historical transformation was processed')"""
          if patched.count(old_version) != 1:
              raise SystemExit('REFUSED: runtime verification replacement is not unique')
          patched = patched.replace(old_version, new_version, 1)
          compile(patched, str(builder), 'exec')
          
          # Test the actual functions that will be installed, not look-alike stubs.
          tree = ast.parse(patched)
          selected = ast.Module(body=[n for n in tree.body if isinstance(n, ast.FunctionDef)
                                     and n.name in ('table', 'validated_patch_tables',
                                                    'check_historical_runtime', 'apply_table')], type_ignores=[])
          ns = {'ast': ast}
          exec(compile(selected, '<tested-build-functions>', 'exec'), ns)
          validate = ns['validated_patch_tables']
          move_names = (
              'v78.1 rule experience arbitration engine',
              'v78.1 knowledge conflict arbitration integration',
              'v78.1 system rule arbitration integration',
              'v78.1 runtime version',
          )
          move_rows = [(f'old_m{i}', f'new_m{i}', name) for i, name in enumerate(move_names)]
          intelligence = [('a', 'b', 'before'), ('c', 'd', 'v79.0 engine'), ('e', 'f', 'after')]
          portfolio = [('g', 'h', 'portfolio before')] + move_rows + [('i', 'j', 'portfolio after')]
          def as_source(a, b):
              return 'PATCHES = ' + repr(tuple(a)) + '\nPORTFOLIO_PATCHES = ' + repr(tuple(b)) + '\n'
          checks = []
          def check(name, fn):
              fn()
              checks.append({'name': name, 'result': 'PASS'})
          def assert_true(value):
              if not value:
                  raise AssertionError('Build repair regression failed')
          def rejects(fn):
              try:
                  fn()
              except (RuntimeError, ValueError, TypeError, SyntaxError):
                  return
              raise AssertionError('Malformed historical input was accepted')
          a, b, report = validate(as_source(intelligence, portfolio))
          check('preserves_each_original_transformation', lambda: assert_true(Counter(a+b)==Counter(intelligence+portfolio)))
          check('moves_dependencies_before_v79', lambda: assert_true(a[1:5]==move_rows and a[5]==intelligence[1]))
          check('removes_only_misplaced_intelligence_rows', lambda: assert_true(b==[portfolio[0],portfolio[-1]]))
          check('accounts_real_ast_rows_not_a_guessed_count', lambda: assert_true(report['output_intelligence_rows']==7 and report['output_portfolio_rows']==2))
          check('rejects_empty_table', lambda: rejects(lambda:validate(as_source([],portfolio))))
          check('rejects_duplicate_labels', lambda: rejects(lambda:validate(as_source(intelligence+[intelligence[0]],portfolio))))
          check('rejects_missing_dependency', lambda: rejects(lambda:validate(as_source(intelligence,portfolio[:-2]+portfolio[-1:]))))
          check('rejects_dependency_already_in_both_tables', lambda: rejects(lambda:validate(as_source(intelligence+[move_rows[0]],portfolio))))
          check('rejects_absent_v79_boundary', lambda: rejects(lambda:validate(as_source([intelligence[0]],portfolio))))
          check('rejects_empty_replacement', lambda: rejects(lambda:validate(as_source([('', 'b','empty')]+intelligence,portfolio))))
          check('rejects_executable_table_value', lambda: rejects(lambda:validate("PATCHES = make_table()\nPORTFOLIO_PATCHES = ()\n")))
          check('rejects_unknown_misplaced_label', lambda: rejects(lambda:validate(as_source(intelligence,portfolio+[('k','l','v78.1 unexpected')]))))
          check('checks_actual_runtime_assignment', lambda:ns['check_historical_runtime']("VERSION='expected'\n",'expected'))
          check('rejects_version_only_in_comment', lambda:rejects(lambda:ns['check_historical_runtime']("VERSION='wrong'\n# expected\n",'expected')))
          check('rejects_multiple_runtime_assignments', lambda:rejects(lambda:ns['check_historical_runtime']("VERSION='expected'\nVERSION='expected'\n",'expected')))
          check('missing_source_anchor_remains_fatal',lambda:rejects(lambda:ns['apply_table']('abc',[('missing','target','x')],[])))
          check('historical_hash_check_retained',lambda:assert_true('if actual!=BLOB: raise RuntimeError' in patched))
          check('input_source_hash_checks_retained',lambda:assert_true("if hashlib.sha256(data).hexdigest()!=lock['files'][name]['sha256']" in patched))
          
          # Regression from real immutable source lines 628 and 653, both fetched
          # from commit 8d7fd5f3e2cccf262b677707bad57d6e1e5acbc2.
          version_row = (
              "VERSION = 'veritas-max-product-v78.0-impulse-portfolio-consistency'",
              "VERSION = 'veritas-max-product-v78.1-rule-experience-arbitration'",
              'v78.1 runtime version',
          )
          exact_moves = move_rows[:3] + [version_row]
          real_shape_i = intelligence[:2] + [version_row] + intelligence[2:]
          real_shape_p = [portfolio[0]] + exact_moves + [portfolio[-1]]
          ra, rb, real_report = validate(as_source(real_shape_i, real_shape_p))
          check('known_v78_1_transition_in_both_input_tables_is_valid',
                lambda: assert_true(real_report['reviewed_repeated_labels'] == {'v78.1 runtime version': 2}))
          check('both_runtime_occurrences_retained_not_deduplicated',
                lambda: assert_true(Counter(ra + rb) == Counter(real_shape_i + real_shape_p)
                                    and ra.count(version_row) == 2))
          check('moved_dependency_precedes_original_runtime_occurrence',
                lambda: assert_true(ra[1:5] == exact_moves and ra[6] == version_row))
          identities = [x['id'] for x in real_report['input_occurrences']]
          check('each_input_occurrence_has_unique_identity',
                lambda: assert_true(len(identities) == len(set(identities)) == len(ra) + len(rb)))
          bad_i = real_shape_i[:2] + [(version_row[0], "VERSION = 'wrong'", version_row[2])] + real_shape_i[3:]
          check('same_version_label_with_different_body_is_rejected',
                lambda: rejects(lambda: validate(as_source(bad_i, real_shape_p))))
          check('third_version_occurrence_is_rejected',
                lambda: rejects(lambda: validate(as_source(real_shape_i + [version_row], real_shape_p))))
          check('two_version_occurrences_in_one_table_are_rejected',
                lambda: rejects(lambda: validate(as_source(real_shape_i + [version_row], portfolio))))
          version_log = []
          version_out = ns['apply_table'](version_row[0], [version_row, version_row], version_log)
          check('exact_repeat_is_processed_as_already_present',
                lambda: assert_true(version_out == version_row[1]
                                    and [x['status'] for x in version_log] == ['APPLIED', 'ALREADY_PRESENT']))
          check('runtime_after_duplicate_is_real_ast_assignment',
                lambda: ns['check_historical_runtime'](version_out, 'veritas-max-product-v78.1-rule-experience-arbitration'))
          check('source_hash_guard_precedes_diagnostic_copy_and_validation',
                lambda: assert_true(patched.index('if actual!=BLOB: raise RuntimeError')
                                    < patched.index("reports/historical_dependency.source.txt")
                                    < patched.index('ip,pp,accounting=validated_patch_tables(text)')))

          builder.write_text(patched, encoding='utf-8')
          report_path = root / 'reports/ci_build_repair.json'
          report_path.parent.mkdir(exist_ok=True)
          report_path.write_text(json.dumps({
              'revision': 'RC2-CI3',
              'scope': 'build_accounting_only_no_trading_logic_changes',
              'original_builder_sha256': expected,
              'corrected_builder_sha256': hashlib.sha256(builder.read_bytes()).hexdigest(),
              'local_regression_tests': checks,
              'full_historical_build_must_run_next': True,
              'postgres_acceptance_must_run_next': True,
              'production_touched': False,
          }, indent=2), encoding='utf-8')
          print('Build-accounting regressions passed:', len(checks))
          print('Historical blob verification and every source-anchor check remain mandatory')
          PY_CI_FIX
      - name: Assemble exact historical analytics and integrate v85
        working-directory: ${{ env.V85_ROOT }}
        shell: bash
        run: |
          set -o pipefail
          python tools/build_release.py 2>&1 | tee reports/build_stdout.log
      - name: Check actual imported version and executable hashes
        working-directory: ${{ env.V85_ROOT }}
        run: python tools/validate_core_manifest.py
      - name: Run core and full-source integration tests
        working-directory: ${{ env.V85_ROOT }}
        run: python tools/run_checks.py
      - name: Test transactions on temporary PostgreSQL 18
        working-directory: ${{ env.V85_ROOT }}
        run: python ci_tests/test_postgres.py
      - name: Launch HTTP process and check readiness and shutdown
        working-directory: ${{ env.V85_ROOT }}
        run: python tools/run_http_smoke.py
      - name: Build staging candidate only after acceptance passes
        working-directory: ${{ env.V85_ROOT }}
        run: python tools/package_release.py --acceptance
      - name: Publish accepted staging candidate, not a production deployment
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VERITAS-v85-STAGING-CANDIDATE
          path: ${{ env.V85_ROOT }}/dist/VERITAS_v85_STAGING.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish evidence generated during this run
        if: ${{ always() && env.V85_ROOT != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: VERITAS-v85-test-evidence
          path: ${{ env.V85_ROOT }}/reports/
          if-no-files-found: warn
          retention-days: 30
