name: VERITAS regime-gated specialist control

on:
  push:
    branches:
      - research/full-arsenal-20261005
    paths:
      - tools/research_crypto_regime_gated_specialists.py
      - .github/workflows/veritas-regime-specialists.yml
  workflow_dispatch:

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-arsenal-20261005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Download 2022-2026 spot cache
        uses: actions/download-artifact@v4
        with:
          name: veritas-manager-library-result
          path: manager_library_out
          github-token: ${{ github.token }}
          run-id: 37210798801
      - name: Download 2020-2021 spot cache
        uses: actions/download-artifact@v4
        with:
          name: veritas-external-holdout
          path: external_holdout_out
          github-token: ${{ github.token }}
          run-id: 37268494688
      - name: Run regime-gated specialists
        run: python tools/research_crypto_regime_gated_specialists.py
      - name: Print compact
        if: always()
        run: |
          if [ -f regime_specialist_out/result.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('regime_specialist_out/result.json'))
          out={k:{q:v.get(q) for q in ('allowed_regimes','external_2020','external_2021','diagnostic_2026','external_verdict')} for k,v in x.get('modules',{}).items()}
          print('VERITAS_REGIME_SPECIALIST_COMPACT='+json.dumps(out,separators=(',',':')))
          PY
          fi
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-regime-specialist
          path: regime_specialist_out/
          retention-days: 14
