name: VERITAS quarter-hour order-flow research

on:
  push:
    branches:
      - research/full-arsenal-20261005
    paths:
      - tools/research_crypto_quarter_hour_flow.py
      - .github/workflows/veritas-quarter-hour.yml
  workflow_dispatch:

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        asset: [BTC, ETH]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-arsenal-20261005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Run quarter-hour flow study
        run: python tools/research_crypto_quarter_hour_flow.py --asset ${{ matrix.asset }}
      - name: Print result
        if: always()
        run: |
          ASSET_LOWER=$(echo "${{ matrix.asset }}" | tr '[:upper:]' '[:lower:]')
          FILE="quarter_hour_out/${ASSET_LOWER}/result.json"
          if [ -f "$FILE" ]; then
            python - "$FILE" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          print('VERITAS_QUARTER_HOUR_COMPACT='+json.dumps(x,separators=(',',':')))
          PY
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-quarter-hour-${{ matrix.asset }}
          path: quarter_hour_out/
          retention-days: 14
