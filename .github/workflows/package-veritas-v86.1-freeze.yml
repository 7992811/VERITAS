name: Package VERITAS v86.1 Frozen Release

on:
  push:
    branches:
      - 'release/veritas-v86.1-team-learning-ui-freeze'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen release
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record immutable release head
        shell: bash
        run: |
          git rev-parse HEAD > VERITAS_v86.1_RELEASE_HEAD.txt
          printf 'VERITAS v86.1 Team Learning + UI/Data Integrity Freeze\n' > VERITAS_v86.1_PACKAGE_INFO.txt
          printf 'Branch: release/veritas-v86.1-team-learning-ui-freeze\n' >> VERITAS_v86.1_PACKAGE_INFO.txt
          printf 'Head: %s\n' "$(git rev-parse HEAD)" >> VERITAS_v86.1_PACKAGE_INFO.txt
          printf 'Generated by GitHub Actions from the frozen release branch.\n' >> VERITAS_v86.1_PACKAGE_INFO.txt

      - name: Upload frozen release package
        uses: actions/upload-artifact@v4
        with:
          name: VERITAS_v86.1_TEAM_LEARNING_UI_FREEZE
          path: |
            .
            !.git/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
