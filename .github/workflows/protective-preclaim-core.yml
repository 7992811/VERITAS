name: Protective Preclaim Core CI
on:
  push:
    branches: [ "ci/protective-preclaim-core-0ac4dcd" ]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
      - run: pip install -r requirements-intelligence.txt
      - name: Compile touched runtime
        run: python -m py_compile veritas_book_lock.py veritas_position_guard.py veritas_portfolio_cycle.py
      - name: Protective lock contracts
        run: python -m unittest -v test_veritas_book_lock.py test_veritas_book_fairness.py test_veritas_portfolio_cycle.py
