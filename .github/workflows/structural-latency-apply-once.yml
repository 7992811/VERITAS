name: Apply and verify structural latency repair
on:
  push:
    branches: [fix/structural-latency-book-20261007]
    paths: [.github/workflows/structural-latency-apply-once.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - run: pip install -r requirements-intelligence.txt
      - name: Apply pinned source patch
        run: |
          python tools/apply_structural_latency_repair.py
          python -m py_compile veritas_structural_validation_cache.py veritas_structural_breakout.py veritas_breakout_runtime.py veritas_book_lock.py test_veritas_structural_latency.py
          git diff --check
          git config user.name 'VERITAS latency repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veritas_structural_breakout.py veritas_breakout_runtime.py veritas_book_lock.py
          git commit -m 'Retry the reserved book before recomputing history; memoize exact static proofs'
          git push origin HEAD:fix/structural-latency-book-20261007
      - name: Verify structural, risk, source and concurrency rules
        run: |
          set -o pipefail
          python -m unittest -v test_veritas_structural_latency.py test_veritas_structural_breakout.py test_veritas_structural_facts_cache.py test_veritas_structural_cny_episodes.py test_veritas_breakout_runtime.py test_veritas_currency_feed_recovery.py test_veritas_weighted_structural_economics.py test_veritas_structural_lifecycle.py test_veritas_structural_management.py test_veritas_book_lock.py test_veritas_portfolio_cycle.py test_veritas_source_identity_roundtrip.py test_veritas_repeat_add.py 2>&1 | tee diagnostics/latency-tests-after.txt
      - name: Architecture guard
        run: python tools/architecture_guard.py
      - name: Record synthetic profile after repair
        if: success()
        run: |
          python - <<'PY'
          import cProfile, io, pstats, unittest
          from pathlib import Path
          suite=unittest.defaultTestLoader.loadTestsFromNames(['test_veritas_structural_cny_episodes','test_veritas_structural_lifecycle','test_veritas_structural_facts_cache'])
          profile=cProfile.Profile();profile.enable()
          result=unittest.TextTestRunner(verbosity=0).run(suite)
          profile.disable()
          out=io.StringIO();pstats.Stats(profile,stream=out).strip_dirs().sort_stats('cumulative').print_stats(40)
          Path('diagnostics/latency-profile-after.txt').write_text(out.getvalue())
          if not result.wasSuccessful():raise SystemExit('profile regression failed')
          PY
      - name: Commit only synthetic diagnostic results
        if: always()
        run: |
          git add diagnostics/
          git diff --cached --quiet || git commit -m 'Record latency regression results on isolated branch'
          git push origin HEAD:fix/structural-latency-book-20261007
