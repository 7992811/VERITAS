name: Apply and verify structural latency repair
on:
  push:
    branches: [fix/structural-latency-book-20261007]
    paths: [.github/workflows/structural-latency-apply-once.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
      - run: pip install -r requirements-intelligence.txt
      - name: Optimize only detached native snapshots
        run: |
          python tools/optimize_native_snapshot_copies.py
          python -m py_compile veritas_data_copy.py veritas_structural_breakout.py veritas_breakout_runtime.py veritas_timeframe_policy.py veritas_timeframe_data.py veritas_structural_lifecycle.py
          git diff --check
          git config user.name 'VERITAS latency repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veritas_structural_breakout.py veritas_breakout_runtime.py veritas_timeframe_policy.py veritas_timeframe_data.py veritas_structural_lifecycle.py
          git commit -m 'Eliminate discarded proof copies and fast-copy exact native data graphs'
          git push origin HEAD:fix/structural-latency-book-20261007
      - name: Export tracked source and isolated local-test dependencies
        run: |
          mkdir -p /tmp/veritas-source-export/wheels
          git archive --format=tar.gz --output=/tmp/veritas-source-export/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/veritas-source-export/COMMIT.txt
          pip download --only-binary=:all: --python-version 3.13 --platform manylinux2014_x86_64 --implementation cp --abi cp313 'psycopg[binary]==3.3.6' -d /tmp/veritas-source-export/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: veritas-isolated-repair-source
          path: /tmp/veritas-source-export/
          retention-days: 2
      - name: Verify copy, structural, risk, source and concurrency rules
        run: |
          set -o pipefail
          python -m unittest -v test_veritas_data_copy.py test_veritas_structural_latency.py test_veritas_retry_freshness.py test_veritas_structural_breakout.py test_veritas_structural_facts_cache.py test_veritas_structural_cny_episodes.py test_veritas_breakout_runtime.py test_veritas_currency_feed_recovery.py test_veritas_weighted_structural_economics.py test_veritas_structural_lifecycle.py test_veritas_structural_management.py test_veritas_book_lock.py test_veritas_portfolio_cycle.py test_veritas_source_identity_roundtrip.py test_veritas_repeat_add.py 2>&1 | tee diagnostics/latency-tests-after.txt
      - name: Architecture guard
        run: python tools/architecture_guard.py
      - name: Compare full causal outputs and same-run CPU timing with pinned baseline
        run: |
          git fetch --depth=1 origin f848e869361fae0356e8aac66671e291290ece6f
          git show f848e869361fae0356e8aac66671e291290ece6f:veritas_structural_breakout.py > /tmp/veritas-structural-baseline.py
          PYTHONPATH=. python tools/benchmark_structural_equivalence.py /tmp/veritas-structural-baseline.py
      - name: Commit only isolated diagnostic results
        if: always()
        run: |
          git add diagnostics/
          git diff --cached --quiet || git commit -m 'Record native-copy regression and equivalence benchmark results'
          git push origin HEAD:fix/structural-latency-book-20261007
