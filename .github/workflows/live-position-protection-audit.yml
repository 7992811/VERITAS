name: Live Position Protection Audit
# rerun-v91.8.38
on:
  push:
    branches: [ "audit/live-position-protection-0dbb9f2" ]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read production position protection audit
        shell: python
        run: |
          import json, urllib.request, time
          base='https://veritas-intelligence-v1.onrender.com/api/v1/paper-portfolios'
          data={}
          for attempt in range(8):
              url=base+'?cb='+str(int(time.time()*1000))
              req=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'VERITAS-live-protection-audit/1.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  data=json.load(r)
              positions=sum(len(p.get('positions') or []) for p in data.get('portfolios') or [])
              print('PROBE='+json.dumps({'attempt':attempt+1,'status':data.get('status'),
                    'positions_complete':data.get('positions_complete'),
                    'accounting_complete':data.get('accounting_complete'),
                    'api_source':data.get('api_source'),'positions':positions},separators=(',',':')))
              if (data.get('positions_complete') is not False and
                      data.get('accounting_complete') is not False and
                      positions>0 and data.get('position_protection_audit')):
                  break
              time.sleep(8)
          summary=data.get('position_protection_audit') or {}
          print('AUDIT_SUMMARY='+json.dumps(summary,ensure_ascii=False,separators=(',',':')))
          rows=[]
          for p in data.get('portfolios') or []:
              for z in p.get('positions') or []:
                  a=z.get('protection_audit') or {}
                  checks=a.get('checks') or {}
                  rows.append({
                    'portfolio':p.get('name'),'asset':z.get('asset'),'direction':z.get('direction'),
                    'status':a.get('status'),'errors':a.get('errors'),'warnings':a.get('warnings'),
                    'sl':z.get('effective_stop_price'),'tp1':z.get('tp1_price'),
                    'tp2_or_runner':z.get('second_take_price'),'second_kind':z.get('second_take_kind'),
                    'tf':a.get('management_timeframe'),
                    'source':(checks.get('source') or {}).get('status'),
                    'profit':(checks.get('profit_protection') or {}).get('state'),
                    'to_sl_pct':a.get('distance_to_stop_pct'),
                    'to_target_pct':a.get('distance_to_next_target_pct'),
                  })
          print('AUDIT_ROWS='+json.dumps(rows,ensure_ascii=False,separators=(',',':')))
