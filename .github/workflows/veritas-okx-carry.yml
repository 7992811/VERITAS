name: VERITAS OKX carry replication

on:
  push:
    branches:
      - research/full-arsenal-20261005
    paths:
      - tools/research_crypto_okx_carry_replication.py
      - .github/workflows/veritas-okx-carry.yml
  workflow_dispatch:

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/full-arsenal-20261005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3
      - name: Run independent OKX replication
        run: python tools/research_crypto_okx_carry_replication.py
      - name: Print compact
        if: always()
        run: |
          if [ -f okx_carry_out/result.json ]; then
            python - <<'PY'
          import json
          x=json.load(open('okx_carry_out/result.json'))
          out={}
          for a,z in x.get('assets',{}).items():
              out[a]={'data':z.get('data'),'costs':z.get('costs')}
              for k,v in z.items():
                  if k=='base' or k.startswith('stress_'):
                      out[a][k]={'metrics':v.get('metrics'),'years':v.get('years'),'bootstrap':v.get('bootstrap')}
          print('VERITAS_OKX_CARRY_COMPACT='+json.dumps(out,separators=(',',':')))
          PY
          fi
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veritas-okx-carry
          path: okx_carry_out/
          retention-days: 14
