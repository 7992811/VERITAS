name: Execution Quality Workspace
on:
  push:
    branches: [feature/execution-quality-v3-20261006]
    paths: ['.github/workflows/execution-quality-build.yml', 'tools/apply_execution_quality.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d7a22498e23d0f323c5f7410b9fb1edc1da67b99
      - name: Export reviewed source files for integration
        run: |
          python - <<'PY'
          import pathlib, zipfile, subprocess
          print(subprocess.check_output(['git','rev-parse','HEAD']).decode())
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('/tmp/veritas-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in tracked:
                  p=pathlib.Path(name)
                  allowed=p.suffix in ('.py','.cjs','.yml','.yaml','.md') or p.name.startswith('requirements') or name=='vendor/tbank/russian_trusted_root_ca.pem'
                  if p.is_file() and allowed and not any(x.startswith('.env') for x in p.parts):
                      z.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: veritas-source
          path: /tmp/veritas-source.zip
          retention-days: 1
